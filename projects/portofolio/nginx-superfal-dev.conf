# Nginx untuk superfal-dev.com (portofolio statis).
# Pasang:  sudo cp nginx-superfal-dev.conf /etc/nginx/sites-available/superfal-dev
#          sudo ln -s /etc/nginx/sites-available/superfal-dev /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d superfal-dev.com -d www.superfal-dev.com
# Ganti domain nanti: ubah dua nama di server_name, reload, lalu jalankan certbot untuk domain baru.
server {
    listen 80;
    listen [::]:80;
    server_name superfal-dev.com www.superfal-dev.com;

    root /var/www/superfal-dev;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /sumber/ {
        deny all;        # bahan mentah CV & gambar pratinjau, tidak perlu publik
    }

    location ~ \.(md|conf)$ {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
