<script>

/* motion blur berarah (bang-motion): filter SVG per tween, dilepas saat selesai */
const defs=$('#filters defs');let fc=0;
function makeBlur(){const id='mb'+(fc++),NS='http://www.w3.org/2000/svg',fl=document.createElementNS(NS,'filter');fl.id=id;
  fl.setAttribute('x','-60%');fl.setAttribute('y','-60%');fl.setAttribute('width','220%');fl.setAttribute('height','220%');
  const g=document.createElementNS(NS,'feGaussianBlur');g.setAttribute('stdDeviation','0 0');fl.appendChild(g);defs.appendChild(fl);return{url:`url(#${id})`,node:g};}
function blurTween(targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){const b=makeBlur(),o={v:from};tl.set(targets,{filter:b.url},at);
  tl.fromTo(o,{v:from},{v:to,duration:dur,ease,immediateRender:false,onUpdate(){b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);tl.set(targets,{filter:'none'},at+dur);}

const words=el=>$$('.w',el);
function say(sel,at,{dur=.6,st=.09,mode='up'}={}){const el=$(sel),ws=words(el);tl.set(el,{opacity:1},at);
  if(mode==='scale')tl.fromTo(ws,{opacity:0,scale:.6,rotate:-4},{opacity:1,scale:1,rotate:0,duration:dur,ease:'back.out(1.7)',stagger:st,immediateRender:false},at);
  else if(mode==='left'){tl.fromTo(ws,{opacity:0,xPercent:-45},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(el,at,40,0,dur+st*ws.length,{ease:'power4.out'});return;}
  else if(mode==='right'){tl.fromTo(ws,{opacity:0,xPercent:45},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(el,at,40,0,dur+st*ws.length,{ease:'power4.out'});return;}

  blurTween(el,at,24,0,dur+st*ws.length,VERT);}

  add(at('s8','mentah')+.2,'text/chalk-line',.40,{max:.35,note:'coret X 2'});
  add(CUT('s9')-1.4,'light/light-sweep-magic',.34,{max:1.4,al:'tail',note:'sapuan naik menuju drop'});
  add(CUT('s9'),'transition/air-whoosh-powerful',.40,{al:'pk',note:'daun melintasi lensa'});
  add(CUT('s9'),'impact/impact-cine-big',.48,{note:'drop musik + puncak volume'});
  /* S9 penutup */
  for(let j=0;j<5;j++)add(SCH.home.t0+.15+j*.24,j%2?'light/stardust-swish':'transition/wing-flutter',.36-j*.04,{max:.8,note:'daun '+(j+1)+' kembali ke tangkai'});
  add(CUT('s9')+.5,'transition/swoosh-quick',.28,{note:'judul ditekan'});
  add(SCH.mkKatuk.t0,'text/marker-pen-line',.36,{max:.45,note:'spidol di bawah katuk'});
  add(at('s9','Simpan')-.05,'paper/paper-staple',.32,{note:'ikon simpan'});
  add(at('s9','bagikan')-.05,'transition/swoosh-quick',.28,{note:'ikon bagikan'});
  add(SCH.boil.t0,'light/sparkle-wand',.30,{max:2.4,note:'sparkle penutup'});
  return X.sort((a,b)=>a.t-b.t);
}

/* ============================== render(t): semua efek fungsi-murni ============================== */
const fr=t=>t*FPS;
function flight(t,{t0,dur,from,to},arc=-260){
  const p=clamp((t-t0)/dur),e=E.outC(p),[sx,sy,sa]=from,[ex,ey,ea]=to;
  const mx=(sx+ex)/2,my=(sy+ey)/2+arc,x=(1-e)**2*sx+2*(1-e)*e*mx+e*e*ex,y=(1-e)**2*sy+2*(1-e)*e*my+e*e*ey;
  const a=lerp(sa,ea,e)+Math.sin(p*Math.PI*3.2)*(1-p)*38,s=1+Math.sin(p*Math.PI)*.16;return{x,y,a,s,p};}
function swayLeaves(t,ref,hide={},unfold=null){ref.sp.leaves.forEach((L,k)=>{const el=ref.leaves[k];if(hide[L.i]){el.style.visibility='hidden';return;}el.style.visibility='visible';
  let s=1,da=0;if(unfold!=null){const q=E.outB(clamp((t-unfold-k*.035)/.38),1.6);s=Math.max(.001,.15+.85*q);da=(1-q)*(L.side<0?28:-28);}
  el.setAttribute('transform',`translate(${f1(L.px)} ${f1(L.py)}) rotate(${(L.a+da+Math.sin(t*L.sp+L.ph)*L.amp).toFixed(2)}) scale(${s.toFixed(3)})`);});
  ref.sp.flowers.forEach((q,j)=>ref.fls[j].setAttribute('transform',`translate(${f1(q.px)} ${f1(q.py)}) rotate(${(Math.sin(t*1.4+q.ph)*4).toFixed(2)})`));}
function badgeFlight(t,sel,t0){/* lencana daun: melayang dari atas bingkai lalu mendarat */
  const el=$(sel);if(t<t0){el.style.opacity=0;return;}const p=clamp((t-t0)/.85),e=E.outC(p);
  const x=lerp(260,0,e)+Math.sin(p*Math.PI*2.4)*(1-p)*60,y=lerp(-520,0,e),a=Math.sin(p*Math.PI*3)*(1-p)*40-12+(1-e)*-60,s=1+Math.sin(p*Math.PI)*.12;
  el.style.opacity=Math.min(1,p*5);el.style.transform=`translate(${f1(x)}px,${f1(y)}px) rotate(${(a+Math.sin(t*1.3)*2).toFixed(2)}deg) scale(${s.toFixed(3)})`;}
function marker(m,t,t0){const p=clamp((t-t0)/(10/FPS)),e=1-Math.pow(1-p,2.2);m.rect.setAttribute('width',f1(e*(m.len+6)));}
function inkPath(f){/* ink-bleed-reveal: lingkaran + tepi berserabut; r 0->Rmax out(quad), wobble +-8% sin(.32f) meredam di 20f akhir */
  const R=lerp(0,2350,E.outQ(clamp(f/78)))*(1+.08*Math.sin(f*.32)*(1-clamp((f-58)/20))),A=lerp(30,80,clamp(f/78)),cx=380,cy=330,N=180;
  if(R<1)return 'path("M0 0Z")';let d='';
  for(let i=0;i<N;i++){const th=i/N*6.2832;let n=0;for(let k=0;k<INKH.length;k++){const h=INKH[k];n+=h.a*Math.sin(h.k*th+h.p+f*h.w);}
    for(const s of INKS)n+=s.a*Math.exp(-Math.pow((th-s.th)/.035,2));const r=Math.max(0,R+A*n);d+=(i?'L':'M')+f1(cx+Math.cos(th)*r)+' '+f1(cy+Math.sin(th)*r);}
  return `path("${d}Z")`;}
const INKH=(()=>{const R=mulberry32(7),a=[];for(let k=3;k<=46;k+=1)a.push({k,a:(R()-.2)*.9/Math.pow(k,.65),p:R()*6.283,w:(R()-.5)*.02});return a;})();
const INKS=(()=>{const R=mulberry32(19),a=[];for(let i=0;i<9;i++)a.push({th:R()*6.283,a:.6+R()*.9});return a;})();

let grainK=-1;
function render(t){
  applyCam(t);
  /* whip: blur berarah pada kamera */
  const bx=FX.whipX,by=FX.whipY,cam=$('#cam');
  if(bx>.4||by>.4){$('#whipG').setAttribute('stdDeviation',`${bx.toFixed(1)} ${by.toFixed(1)}`);cam.style.filter='url(#whip)';}else cam.style.filter='none';
  /* butiran hidup 12x/dtk + cahaya hangat bergeser */
  const k=Math.floor(t*12);if(k!==grainK){grainK=k;$('#grain').style.transform=`translate(${(k*37)%60-30}px,${(k*61)%60-30}px)`;}
  $('#light').style.background=`radial-gradient(55% 32% at ${f1(30+Math.sin(t*.21)*16)}% ${f1(24+Math.sin(t*.17+1)*8)}%,rgba(255,236,190,.26),transparent 70%)`;

  /* --- tangkai A12: daun bergoyang; daun #1 lepas dan terbang ke A3 --- */
  const L1f=SCH.leaf1,flying=t>=L1f.t0;
  swayLeaves(t,REF.sprA,{[REF.L1.i]:flying},SCH.unfold.t0);
  const b1=$('#badge1');
  if(flying){const q=flight(t,L1f,-300),[ox,oy]=org('a3');b1.style.opacity=1;b1.style.left=f1(q.x-ox-40)+'px';b1.style.top=f1(q.y-oy-REF.L1.w-40)+'px';
    b1.style.transformOrigin=`40px ${f1(REF.L1.w+40)}px`;b1.style.transform=`rotate(${(q.a+(q.p>=1?Math.sin(t*1.3)*2:0)).toFixed(2)}deg) scale(${q.s.toFixed(3)})`;}
  else b1.style.opacity=0;

  /* --- S1: riso-print-hits A (misregistration-hit) — HIT ketukan 4, SNAP +22f --- */
  {const HIT=SCH.riso.hit,f=fr(t-HIT),S=$('#risoS'),Ap=$('#risoA'),Bp=$('#risoB'),SNAPF=22;
    if(f<-8){S.style.visibility='hidden';Ap.style.visibility='hidden';Bp.style.visibility='hidden';}
    else if(f<0){const sx=lerp(1400,0,E.inC(clamp((f+8)/8)));S.style.visibility='visible';Ap.style.visibility=Bp.style.visibility='hidden';S.style.transform=`translateX(${f1(sx)}px)`;}
    else if(f<SNAPF){const m=Math.cos(2*Math.PI/18*f)*Math.exp(-f/60),dx=16*m,dy=7*m;S.style.visibility='hidden';Ap.style.visibility=Bp.style.visibility='visible';
      Ap.style.transform=`translate(${f1(-dx)}px,${f1(dy)}px)`;Bp.style.transform=`translate(${f1(dx)}px,${f1(-dy)}px)`;}
    else{const pu=f<SNAPF+4?1+.03*(1-(f-SNAPF)/4):1;S.style.visibility='visible';Ap.style.visibility=Bp.style.visibility='hidden';S.style.transform=`scale(${pu.toFixed(4)})`;}}

  /* --- S2: masking-tape-slap (paper-craft-moves A) --- */
  {const P=SCH.tape,FS=fr(P.fs),FE=FS+26,S1=fr(P.s1),S2=fr(P.s2),fN=fr(t),pol=$('#polar');
    const amp=x=>clamp((x-FE)/8)*lerp(1,.45,clamp((x-S1)/4));
    const raw=(x,a,w)=>amp(x)*a*Math.sin((x-FE)*w);const froz=(x,a,w)=>x<=S2?raw(x,a,w):lerp(raw(S2,a,w),0,clamp((x-S2)/2));
    const fy=lerp(-120,0,E.outC(clamp((fN-FS)/(FE-FS)))),op=clamp((fN-FS)/10),rot=froz(fN,1.5,.16),bob=froz(fN,5,.11),sink=lerp(0,2,clamp((fN-S2)/2));
    const sh=[lerp(16,3,clamp((fN-S2)/2)),lerp(34,8,clamp((fN-S2)/2)),lerp(.22,.1,clamp((fN-S2)/2))];
    const xo=E.inQ(clamp((t-P.out)/.36)),ex=-300*xo,ey=-240*xo,er=-9*xo;
    if(t<SCH.home.t0){pol.style.opacity=op*(1-xo);pol.style.transform=`translate(${f1(ex)}px,${f1(fy+bob+sink+ey)}px) rotate(${(rot+er).toFixed(2)}deg)`;$('#polar .polar').style.boxShadow=`0 ${f1(sh[0])}px ${f1(sh[1])}px rgba(30,42,34,${sh[2].toFixed(3)})`;}
    [['#tape1',S1,-170,-130,-38],['#tape2',S2,170,130,-34]].forEach(([sel,land,fx,fy2,r0])=>{const el=$(sel);if(fN<land-6){el.style.opacity=0;return;}
      const q=E.outC(clamp((fN-(land-6))/6)),sc=lerp(1.45,1,q),r=fN<land?lerp(r0-16,r0+7,E.outQ(clamp((fN-(land-6))/6))):lerp(r0+7,r0,E.outQ(clamp((fN-land)/4))),sy=fN>=land&&fN<land+1?.72:fN>=land+1&&fN<land+2?.9:1;
      el.style.opacity=Math.min(.95,(fN-(land-6))/2*.85)*(1-xo);el.style.transform=`translate(${f1(fx*(1-q)+ex)}px,${f1(fy2*(1-q)+ey)}px) rotate(${(r+er).toFixed(2)}deg) scale(${sc.toFixed(3)}) scaleY(${sy})`;});}

  /* --- S3: tetes ASI naik --- */
  {const D=SCH.drops;for(let i=0;i<3;i++){const el=$('#drop'+i);if(t<D.t0||t>D.t1){el.style.opacity=0;continue;}const ph=((t-D.t0)*.55+i/3)%1;
    el.style.left=f1(960+i*34+Math.sin(ph*6+i)*14)+'px';el.style.top=f1(1010-ph*330)+'px';el.style.opacity=(Math.sin(ph*Math.PI)*clamp((t-D.t0)/.4)*clamp((D.t1-t)/.3)).toFixed(3);el.style.transform=`scale(${(.7+ph*.4).toFixed(3)})`;}}
  marker(REF.mk.ASI,t,SCH.mkASI.t0);

  /* --- lencana daun 2-5 (tanda tangan gerak) --- */
  badgeFlight(t,'#badge2',SCH.badge2.t0);badgeFlight(t,'#badge3',SCH.badge3.t0);badgeFlight(t,'#badge4',SCH.badge4.t0);badgeFlight(t,'#badge5',SCH.badge5.t0);

  /* --- S4: odometer-digit-roll — strip 0-9, digit i melambat di 20+7i f, overshoot +0.5, kunci 6f, 2 bayangan --- */
  {const s0=SCH.odo.s0,f=fr(t-s0),D=[1,6,4],{ROW}=REF.odo;
    const posAt=(ff,i)=>{const d=D[i],s=20+i*7,p0=.85*s,Tt=Math.ceil((p0+6-d)/10)*10+d;if(ff<s)return .85*Math.max(ff,0);
      if(ff<s+16)return lerp(p0,Tt+.5,E.outC(clamp((ff-s)/16)));if(ff<s+22)return lerp(Tt+.5,Tt,E.outC(clamp((ff-s-16)/6)));return Tt;};
    REF.reels.forEach((st,i)=>{const p=posAt(f,i),sp=Math.abs(p-posAt(f-1,i)),g=clamp((sp-.06)/(.5-.06));
      st[0].style.transform=`translateY(${f1(-(p%10)*ROW)}px)`;st[1].style.transform=`translateY(${f1(-(p%10)*ROW+ROW*.5)}px)`;st[1].style.opacity=(.25*g).toFixed(3);
      st[2].style.transform=`translateY(${f1(-(p%10)*ROW-ROW*.5)}px)`;st[2].style.opacity=(.12*g).toFixed(3);});
    const L=56,pu=f>=L&&f<L+8?Math.sin((f-L)/8*Math.PI):0;$('#odoNum').style.transform=`scale(${(1+.035*pu).toFixed(4)})`;
    $('#odoNum').style.color=pu>0?`color-mix(in srgb,${PAL.leaf} ${f1(100-pu*60)}%,#0c1a10)`:PAL.leaf;}
  marker(REF.mk.k164,t,SCH.mk164.t0);

  /* --- S5: hatch-depth — tumbuh out-cubic, morph silang, getar +-2% --- */
  {const B=SCH.bars,val=[233,143],{BMAX}=REF.bars;for(let i=0;i<2;i++){const g=seg(t,B.g0+i*.22,B.g0+i*.22+.97,E.outC),m=seg(t,B.m0+i*.13,B.m0+i*.13+.62),
      wg=1+Math.sin(t*6.82+i*2.1)*.02*seg(t,B.m0+.6,B.m0+1.26),w=g*(val[i]/233)*BMAX*wg;
    $('#barH'+i).style.width=f1(w)+'px';$('#barS'+i).style.width=f1(w)+'px';$('#barH'+i).style.opacity=(1-m).toFixed(3);$('#barS'+i).style.opacity=m.toFixed(3);
    const v=$('#barV'+i);v.style.left=f1(w+22)+'px';v.style.opacity=m.toFixed(3);$('#barL'+i).style.opacity=clamp((t-(B.g0+i*.22))/.3).toFixed(3);}}
  marker(REF.mk.b233,t,SCH.mk233.t0);

  /* --- S6: draw-svg-trace pada mata — 40f in-out cubic, pena 0.045, kilat tutup 2f+6f, isi 8f --- */
  {const f=fr(t-SCH.eye.t0),p=E.ioC(clamp(f/40)),fl=f<42?clamp((f-40)/2):1-E.outQ(clamp((f-42)/6)),t1=$('#eyeT1'),t2=$('#eyeT2');
    t1.setAttribute('stroke-dashoffset',(1-p).toFixed(4));t1.setAttribute('stroke-width',(5+fl*4).toFixed(2));t1.setAttribute('stroke',fl>.5?'#000':PAL.ink);
    t2.setAttribute('opacity',p>.02&&p<.985?1:0);t2.setAttribute('stroke-dashoffset',(.045-p).toFixed(4));
    $('#eyeBody').setAttribute('opacity',E.outQ(clamp((f-40)/8)).toFixed(3));$('#eyeTrace').setAttribute('opacity',(1-clamp((f-46)/10)).toFixed(3));
    $('#eye').style.opacity=f>-1?1:0;
    let lid=0;for(const b of SCH.blink){const q=clamp((t-b)/.2);lid=Math.max(lid,Math.sin(q*Math.PI));}$('#eyeBody').setAttribute('transform',`scale(1 ${(1-.9*lid).toFixed(3)})`);
    $('#eyeIris').setAttribute('transform',`translate(${f1(Math.sin(t*.9)*16)} ${f1(Math.sin(t*.7)*5)})`);}

  /* --- S7: sel darah merah melayang --- */
  $$('#rbcs .rbc').forEach((r,i)=>{r.style.translate=`${f1(Math.sin(t*.9+i*1.7)*7)}px ${f1(Math.sin(t*.7+i)*9)}px`;r.style.rotate=f1(Math.sin(t*.4+i)*12)+'deg';});

  /* --- S7 -> S8: ink-bleed-reveal (clip-path berserabut, lalu dilepas) --- */
  {const g8=$('#g8'),f=fr(t-SCH.ink.f0),drop=$('#inkdrop');
    if(t<SCH.ink.drop){g8.style.clipPath='path("M0 0Z")';}
    else if(f<80){g8.style.clipPath=inkPath(Math.max(0,f));}
    else g8.style.clipPath='none';
    const dp=clamp((t-SCH.ink.drop)/.16);drop.style.opacity=t>=SCH.ink.drop&&t<SCH.ink.f0+.05?1:0;drop.style.transform=`translate(380px,${f1(lerp(-200,330,E.inQ(dp)))}px)`;}

  /* --- S8: uap panci --- */
  $$('#steam .st').forEach((p,i)=>{const ph=((t-SCH.steam.t0)*.5+i/3)%1,on=t>SCH.steam.t0;p.setAttribute('transform',`translate(${f1(Math.sin(ph*6.3+i)*8)} ${f1(-ph*90)})`);p.setAttribute('opacity',on?(Math.sin(ph*Math.PI)*.9).toFixed(3):0);});
  {const q=clamp((t-SCH.timer.t0)/SCH.timer.dur),a=E.ioQ(q)*110*Math.PI/180,x=150+Math.sin(a)*100,y=170-Math.cos(a)*100;
    $('#timerArc').setAttribute('d',q>0?`M150 170L150 70A100 100 0 ${a>Math.PI?1:0} 1 ${f1(x)} ${f1(y)}Z`:'M150 170Z');}

  /* --- lensa daun (S8 -> S9) --- */
  {const p=FX.lensP,e=p;const x=lerp(-2900,1500,e),y=lerp(2500,-1200,e),s=lerp(1.6,2.6,Math.sin(e*Math.PI));
    $('#lens').style.transform=`translate(${f1(x)}px,${f1(y)}px) rotate(-38deg) scale(${s.toFixed(3)})`;}

  /* --- S9: daun bernomor kembali ke tangkai (momen istimewa) --- */
  {const ref=REF.sprZ,t0=SCH.home.t0,keys=Object.keys(NUMB).map(Number),starts=[[-520,-260],[1300,-300],[-560,700],[1380,560],[520,-700]];
    ref.sp.leaves.forEach((L,k)=>{const el=ref.leaves[k],j=keys.indexOf(L.i);let x=L.px,y=L.py,a=L.a+Math.sin(t*L.sp+L.ph)*L.amp,s=1;
      if(j>=0){const s0=t0+.15+j*.24;if(t<s0){el.style.visibility='hidden';return;}const q=flight(t,{t0:s0,dur:.9,from:[starts[j][0],starts[j][1],L.a-120],to:[L.px,L.py,L.a]},-200);
        x=q.x;y=q.y;a=q.p>=1?a:q.a;s=q.p>=1?1+.12*Math.max(0,1-(t-s0-.9)/.25)*Math.sin(Math.min(1,(t-s0-.9)/.25)*Math.PI):q.s;}
      el.style.visibility='visible';el.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${a.toFixed(2)}) scale(${s.toFixed(3)})`);});
    ref.sp.flowers.forEach((q,j)=>ref.fls[j].setAttribute('transform',`translate(${f1(q.px)} ${f1(q.py)}) rotate(${(Math.sin(t*1.4+q.ph)*4).toFixed(2)})`));}
  marker(REF.mk.katuk,t,SCH.mkKatuk.t0);
  /* line-boil: judul akhir "hidup" saat hold; filter dilepas di luar segmen */
  {const on=t>=SCH.boil.t0&&t<SCH.boil.t1,el=$('#ttl9');if(on){$('#boilT').setAttribute('seed',Math.floor(fr(t)/3));el.style.filter='url(#boil)';}else if(el.style.filter.includes('boil'))el.style.filter='none';}

  /* --- subtitle per kata --- */
  for(const q of REF.pages){const p=q.p,a0=p.t-.06;if(t<a0||t>=p.out){if(q.v){q.el.style.visibility='hidden';q.v=false;}continue;}
    q.v=true;const e=E.outB(clamp((t-a0)/.16),2.2),fo=clamp((p.out-t)/.08);q.el.style.visibility='visible';q.el.style.opacity=(Math.min(1,(t-a0)/.07)*fo).toFixed(3);
    q.el.style.transform=`translate(-50%,-50%) translateY(${f1((1-e)*20)}px) scale(${(.93+.07*e).toFixed(4)})`;
    q.ws.forEach((s,i)=>{const w=p.words[i],on=t>=w.t-.03,nx=p.words[i+1],cur=on&&(nx?t<nx.t-.03:t<w.e+.3);const c='sw'+(on?' on':'')+(cur?' cur':'');if(s.className!==c)s.className=c;});}
}

<script>
/* ============================== kontrol: autoplay + loop tanpa player; ?debug=1; ?clean=1 ============================== */
const q=new URLSearchParams(location.search),vo=$('#vo');let audioOn=false,hasVO=!!vo.getAttribute('src');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);render(t);},play:start};
Promise.all(['640 100px Fraunces','italic 600 100px Fraunces','800 64px "Plus Jakarta Sans"','600 40px "Plus Jakarta Sans"','italic 500 40px "Plus Jakarta Sans"','700 60px Kalam','400 40px Kalam']
  .map(s=>document.fonts.load(s))).then(()=>document.fonts.ready).then(()=>{
  build();
  const ink=document.createElement('div');ink.id='inkdrop';ink.className='ab';ink.style.cssText=`width:46px;height:60px;left:0;top:0;opacity:0;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:${PAL.dark};z-index:20`;$('#a67').appendChild(ink);
  choreo();window.OPENER.sfx=sfxTable();
  tl.eventCallback('onComplete',()=>start());
  gsap.ticker.add(()=>{render(tl.time());if(audioOn&&!tl.paused()&&Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
  render(0);window.OPENER.ready=true;
  addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();if(tl.paused()){tl.play();if(hasVO)vo.play();}else{tl.pause();vo.pause();}}});
  if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
    gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
    sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();vo.pause();});addEventListener('pointerup',()=>drag=false);
    sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);render(tl.time());});$('#dPlay').onclick=()=>{if(tl.paused()){tl.play();if(hasVO){vo.currentTime=tl.time();vo.play();}}else{tl.pause();vo.pause();}};}
  if(q.has('clean'))return;
  if(!hasVO){start();return;}
  /* ada suara: coba putar; bila diblokir, tahan di frame awal dan mulai bersama suara pada gestur pertama */
  vo.play().then(()=>{audioOn=true;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});
});
</script>
