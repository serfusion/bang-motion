# Isi bersama superfal-dev.com: portofolio statis + Content Creator di /studio/.
# Dibuat ulang oleh deploy/superfal/pasang.sh (jangan diubah langsung di /etc/nginx).
root __WEB__;
index index.html;
charset utf-8;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location / {
    try_files $uri $uri/ =404;
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# bahan mentah (templat terbaca, sumber CV) tidak disalin ke web; tetap ditutup bila ada
location ^~ /sumber/ { deny all; }
location ~ /\.(?!well-known) { deny all; }
location ~* \.(md|conf|mjs|lock|sh)$ { deny all; }

# Content Creator (panel mesin video). Kunci diperiksa oleh panel; batas percobaan juga di sini.
location = /studio { return 301 /studio/; }
location = /studio/masuk {
    limit_req zone=superfal_masuk burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:__PORT__/masuk;
    include /etc/nginx/snippets/superfal-proxy.conf;
}
location ^~ /studio/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    include /etc/nginx/snippets/superfal-proxy.conf;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
