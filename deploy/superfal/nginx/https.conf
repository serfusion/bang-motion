# superfal-dev.com dengan HTTPS (Let's Encrypt). Dibuat oleh deploy/superfal/pasang.sh.
limit_req_zone $binary_remote_addr zone=superfal_masuk:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __NAMA__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:superfal_ssl:10m;
    ssl_session_timeout 1d;

    if ($host = www.__DOMAIN__) { return 301 https://__DOMAIN__$request_uri; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/superfal-lokasi.conf;
}
